#####################################
# Languages / file types to enable  #
#####################################
ENABLE:
  - JAVA
  - XML
  - MARKDOWN
  - YAML
  - JSON
  - GIT

DISABLE:
  - SPELL
  - COPYPASTE

#####################################
#        Specific linters           #
#####################################
ENABLE_LINTERS:
  # Java
  - JAVA_CHECKSTYLE
  - JAVA_PMD

  # Markdown
  - MARKDOWN_MARKDOWNLINT

  # YAML
  - YAML_YAMLLINT

  # JSON
  - JSON_JSONLINT

  # Repository scanning (security)
  - REPOSITORY_GITLEAKS
  - REPOSITORY_SEMGREP

#####################################
#     Directories to exclude        #
#####################################
EXCLUDED_DIRECTORIES:
  - target

#####################################
#           Reporting               #
#####################################
SHOW_SKIPPED_LINTERS: false
