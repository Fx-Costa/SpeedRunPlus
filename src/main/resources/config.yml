# ========================================
# SpeedRunPlus (SRP) Configuration
# ========================================

# Main world names
main-overworld: world
main-nether: world_nether
main-end: world_the_end

# Game rule settings
game-rules:

  # Assisted triangulation
  assisted-triangulation:

    # Whether to use assisted triangulation
    use-assisted-triangulation: true

    # The triangulation strategy - specifies the triangulation algorithm and thereby the level of assistance and
    # variance during the assisted triangulation
    strategy: DETERMINISTIC

  # Speedrun world seeds
  filtered-seeds:
    # Whether to use filtered seeds or rely on random seeds
    use-filtered-seeds: true

    # Filtered seeds API
    filtered-seeds-api: https://filteredseed.com/getRandomUsedSeed/

    # Weights for each type of seed (higher number = more likely to appear)
    weights:
      MAPLESS: 1
      VILLAGE: 3
      TEMPLE: 2
      SHIPWRECK: 2
      RUINED_PORTAL: 2
      RANDOM: 1

  # Maximum number of players allowed to speedrun simultaneously
  max-players: 4

  # Maximum duration of a speedrun in minutes
  max-time-minutes: 120

  # Time before requests for BattleSpeedrun / Coop are invalidated
  max-request-seconds: 30

# Prefix used for generated speedrun worlds
world-prefix:
  overworld: srp-overworld-
  nether: srp-nether-
  end: srp-end-

# Timer settings
timer:
  # The amount of time to countdown from, when starting a speedrun in seconds
  countdown-seconds: 10

# Podium configuration
podium:
  max: 5
  world: world
  positions:
    1:
      x: 256.5
      y: 65.5
      z: 183.5
      yaw: 180
    2:
      x: 254.5
      y: 64.5
      z: 182.5
      yaw: 180
    3:
      x: 258.5
      y: 64.5
      z: 182.5
      yaw: 180
    4:
      x: 260.5
      y: 63.5
      z: 181.5
      yaw: 180
    5:
      x: 104.5
      y: 63.5
      z: 181.5
      yaw: 180

# AFK configuration
afk:
  # Minutes before ending a speedrun due to inactivity
  timeout-minutes: 5

  # Intervals between each AFK check
  check-interval-seconds: 60

  # Minimum number of blocks the player needs to move
  # to be considered active between each AFK check
  min-distance: 1.0
